<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VeriCred</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body{background:#f3f5f8!important;color:#172b4d;font-family:Inter,"Segoe UI",sans-serif}
      .navbar{background:#14263d!important;padding:1rem 0;border-bottom:3px solid #35cbb0}
      .navbar-brand{font-weight:700;letter-spacing:-.03em;font-size:1.6rem}
      .card{border:1px solid #dfe5ed;box-shadow:0 5px 16px #172b4d08;border-radius:12px}
      .card-body{padding:1.5rem}.btn-primary{background:#155e75;border-color:#155e75}
      .table{border:1px solid #e2e8f0}.table th{font-size:.8rem;letter-spacing:.04em;color:#617086}
      h2,h3{font-weight:650;letter-spacing:-.025em}a{color:#0e7490}
      input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2dd4bf;outline-offset:3px}
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">VeriCred</a>
    <div class="navbar-nav ms-auto flex-row flex-wrap align-items-center gap-2">
      {% if user.is_authenticated %}
      <a class="nav-link" href="{% url 'certificate_list' %}">Certificates</a>
      <a class="nav-link" href="{% url 'audit_log_list' %}">Audit Logs</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light ms-2">Logout</button></form>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
    {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
